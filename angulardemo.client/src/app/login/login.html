<h2>Форма авторизации</h2>

<form (ngSubmit)="login()">

  <label>Логин</label>
  <input type="email" [(ngModel)]="user.email" name="email" required>

  <label>Пароль</label>
  <input type="password" [(ngModel)]="user.password" name="password" required>

  <button type="submit">Вход в панель</button>

</form>

<p>{{ message }}</p>
